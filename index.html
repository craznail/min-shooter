<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Shooter</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    class MainScene extends Phaser.Scene {
      constructor() {
        super('MainScene');
      }

      create() {
        const w = this.scale.width;
        const h = this.scale.height;

        const g = this.add.graphics();

        g.fillStyle(0x00ff88, 1);
        g.fillTriangle(16, 0, 32, 32, 0, 32);
        g.generateTexture('player', 32, 32);
        g.clear();

        g.fillStyle(0xffff00, 1);
        g.fillRect(0, 0, 4, 12);
        g.generateTexture('bullet', 4, 12);
        g.clear();

        g.fillStyle(0xff4444, 1);
        g.fillRect(0, 0, 28, 28);
        g.generateTexture('enemy', 28, 28);
        g.destroy();

        this.player = this.physics.add.sprite(w / 2, h - 60, 'player');
        this.player.setCollideWorldBounds(true);

        this.bullets = this.physics.add.group({
          defaultKey: 'bullet',
          maxSize: 30
        });

        this.enemies = this.physics.add.group();

        this.score = 0;
        this.gameOver = false;
        this.lastShot = 0;

        this.scoreText = this.add.text(16, 16, 'Score: 0', {
          fontSize: '24px',
          color: '#ffffff'
        });

        this.infoText = this.add.text(w / 2, h - 18, 'Arrows move, Space shoot, R restart', {
          fontSize: '18px',
          color: '#aaaaaa'
        }).setOrigin(0.5, 1);

        this.gameOverText = this.add.text(w / 2, h / 2, '', {
          fontSize: '36px',
          color: '#ff5555',
          align: 'center'
        }).setOrigin(0.5);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

        this.enemyTimer = this.time.addEvent({
          delay: 800,
          callback: this.spawnEnemy,
          callbackScope: this,
          loop: true
        });

        this.physics.add.overlap(this.bullets, this.enemies, this.hitEnemy, null, this);
        this.physics.add.overlap(this.player, this.enemies, this.playerHit, null, this);

        this.stars = [];
        for (let i = 0; i < 60; i++) {
          this.stars.push(this.add.rectangle(
            Phaser.Math.Between(0, w),
            Phaser.Math.Between(0, h),
            2, 2,
            0xffffff
          ).setAlpha(Phaser.Math.FloatBetween(0.2, 1)));
        }
      }

      spawnEnemy() {
        if (this.gameOver) return;

        const x = Phaser.Math.Between(20, this.scale.width - 20);
        const enemy = this.enemies.create(x, -20, 'enemy');
        enemy.setVelocityY(Phaser.Math.Between(90, 180));
      }

      shoot() {
        const now = this.time.now;
        if (now - this.lastShot < 180) return;
        this.lastShot = now;

        const bullet = this.bullets.get(this.player.x, this.player.y - 24);
        if (!bullet) return;

        bullet.setActive(true);
        bullet.setVisible(true);
        bullet.body.enable = true;
        bullet.setVelocityY(-420);
      }

      hitEnemy(bullet, enemy) {
        bullet.disableBody(true, true);
        enemy.destroy();
        this.score += 10;
        this.scoreText.setText('Score: ' + this.score);
      }

      playerHit(player, enemy) {
        enemy.destroy();
        this.endGame();
      }

      endGame() {
        this.gameOver = true;
        this.enemyTimer.remove(false);
        this.gameOverText.setText('GAME OVER\nPress R to restart');

        this.input.keyboard.once('keydown-R', () => {
          this.scene.restart();
        });
      }

      update() {
        if (this.gameOver) return;

        const speed = 240;
        this.player.setVelocity(0);

        if (this.cursors.left.isDown) {
          this.player.setVelocityX(-speed);
        } else if (this.cursors.right.isDown) {
          this.player.setVelocityX(speed);
        }

        if (this.cursors.up.isDown) {
          this.player.setVelocityY(-speed);
        } else if (this.cursors.down.isDown) {
          this.player.setVelocityY(speed);
        }

        if (this.spaceKey.isDown) {
          this.shoot();
        }

        this.bullets.children.iterate((b) => {
          if (b && b.active && b.y < -20) {
            b.disableBody(true, true);
          }
        });

        this.enemies.children.iterate((e) => {
          if (e && e.active && e.y > this.scale.height + 40) {
            e.destroy();
          }
        });

        this.stars.forEach((star) => {
          star.y += 1;
          if (star.y > this.scale.height) {
            star.y = 0;
            star.x = Phaser.Math.Between(0, this.scale.width);
          }
        });
      }
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game',
      width: 480,
      height: 640,
      backgroundColor: '#000000',
      physics: {
        default: 'arcade',
        arcade: {
          debug: false
        }
      },
      scene: [MainScene]
    };

    new Phaser.Game(config);
  </script>
</body>
</html>
